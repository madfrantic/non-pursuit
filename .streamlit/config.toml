[theme]
# Palette is shared verbatim with demo_pitch.html so the live app and the
# pitch deck read as one artifact. Change these and the CSS custom
# properties in app.py together -- they are two halves of one theme.
primaryColor = "#D4AF37"             # Detective Brass / Badge Gold
backgroundColor = "#0B1325"          # Midnight Cruiser Navy
secondaryBackgroundColor = "#152238" # Precinct Slate
textColor = "#F8FAFC"                # Crisp Paper White
font = "serif"                       # Authoritative Case-File Typography

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[logger]
level = "error"

[client]
showErrorDetails = false
showSidebarNavigation = true
toolbarMode = "viewer"

[global]
developmentMode = false
suppressDeprecationWarnings = true
suppressCachedStAppWarnings = true
