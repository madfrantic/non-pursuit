[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#111827"
textColor = "#F9FAFB"

[server]
headless = true

[logger]
level = "error"

[client]
showErrorDetails = false
showSidebarNavigation = true
toolbarMode = "viewer"

[global]
developmentMode = false
suppressDeprecationWarnings = true
suppressCachedStAppWarnings = true
